scenario_name: "aeb_pedestrian_test_06_low_visibility_rain"
map: "Town01"
weather: "WetCloudy"
simulation_mode: "object_list"
duration: 15.0

ego_vehicle:
  model: "vehicle.tesla.model3"
  target_speed: 35.0

adversary:
  type: "walker.pedestrian.0003"
  behavior: "moving_slow"
  spawn_dist: 42.0
  speed: 1.2

sensors:
  camera:
    image_size_x: 1280
    image_size_y: 720
    fov: 90
  lidar:
    channels: 32
    range: 80

metrics:
  - "distance_to_adversary"
  - "ttc"
  - "detection_confidence"
